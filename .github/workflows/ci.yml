name: CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Read-only preflight, or publish an explicitly reviewed release'
        type: choice
        required: true
        default: preflight
        options: [preflight, deploy]
      reviewed_commit:
        description: 'Deploy only: exact reviewed 40-character main commit'
        type: string
        default: ''
      expected_index_sha256:
        description: 'Deploy only: live index SHA-256 from a fresh preflight'
        type: string
        default: ''
      htaccess:
        description: 'preserve (default), or explicitly verified confirmed-absent'
        type: string
        default: preserve
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  lint-and-test:
    # A manual read-only preflight does not need a dependency install or build.
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'preflight'
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [24.x]
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false
      
    - name: 🔧 Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: 📦 Install dependencies
      run: npm ci
    
    - name: 🔍 Run Biome linter
      run: npm run lint
      continue-on-error: false
    
    - name: Verify finite CSS classes and native HTML interpolation
      run: |
        npm run check:styles
        npm run test:styles
        npm run test:html

    - name: Test deployment safety offline
      run: python3 -m unittest discover -s scripts/deployment -p 'test_*.py' -v

    - name: 🧪 Run tests and enforce coverage thresholds
      run: npm run test:coverage
      continue-on-error: false
      env:
        TZ: Europe/Paris
    
    - name: 🏗️ Build project
      run: |
        cat > .env << 'ENVEOF'
        VITE_SITE_URL=https://localiserbien.fr
        VITE_SITE_NAME=LocaliserBien
        VITE_SITE_DOMAIN=localiserbien.fr
        VITE_CONTACT_EMAIL=contact@localiserbien.fr
        VITE_PUBLICATION_DIRECTOR=
        VITE_ADEME_API_URL=https://data.ademe.fr/data-fair/api/v1/datasets/dpe03existant/lines
        VITE_GEO_API_URL=https://data.geopf.fr/geocodage
        VITE_APP_TITLE=LocaliserBien - Recherchez des correspondances DPE
        VITE_APP_DESCRIPTION=Recherchez gratuitement des correspondances possibles dans les données DPE publiques en France. Un résultat ne garantit pas l'identification du bien.
        VITE_APP_KEYWORDS=localisation bien immobilier,DPE,adresse bien,recherche immobilier,diagnostic performance énergétique,France,localiser bien
        VITE_OG_TITLE=LocaliserBien - Recherchez des correspondances DPE
        VITE_OG_DESCRIPTION=Recherchez gratuitement des correspondances possibles dans les données DPE publiques en France. Un résultat ne garantit pas l'identification du bien.
        VITE_TWITTER_TITLE=LocaliserBien - Recherchez des correspondances DPE
        VITE_TWITTER_DESCRIPTION=Recherchez gratuitement des correspondances possibles dans les données DPE publiques en France. Un résultat ne garantit pas l'identification du bien.
        VITE_HOST_NAME=OVH
        VITE_HOST_ADDRESS=2 rue Kellermann, 59100 Roubaix, France
        VITE_ENABLE_ANALYTICS=false
        VITE_FANCY_UI=true
        VITE_DEV_PORT=3000
        ENVEOF
        npm run build
        node scripts/check-built-site.mjs
      env:
        CI: true
    
    - name: Retain browser dependency boundary evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: browser-dependency-graph
        path: reports/security/runtime-module-graph.json
        if-no-files-found: ignore
        retention-days: 14

    - name: 📊 Check build output
      run: |
        echo "Build completed successfully!"
        echo "Checking dist folder..."
        ls -la dist/
        echo "Build size:"
        du -sh dist/
    
    - name: 📝 Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: dist/
        retention-days: 7
        # Required for the reviewed route-only .htaccess. The build check rejects
        # unexpected hidden files before this artifact can be uploaded.
        include-hidden-files: true

  pwa-lifecycle:
    name: PWA lifecycle (two pinned baselines to same-run candidate)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: npm
    - name: Install current locked test toolchain only
      run: npm ci
    - name: Verify immutable baseline and offline fixture failure cases
      run: npm run test:pwa:unit
    - name: Install official Playwright Chromium and OS dependencies
      run: npx --no-install playwright install --with-deps chromium
    - name: Download this run's exact candidate build
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: dist/
    - name: Verify preserved baseline bytes and record exact artifact provenance
      run: node scripts/pwa/provenance.mjs record
    - name: Test real installation, open-tab upgrade, cleanup and offline boundaries
      run: npm run test:pwa
    - name: Test page copy, mobile filters and inline-map lifecycle
      run: npx --no-install playwright test e2e/map-preview.spec.js e2e/product-pages.spec.js --project=chromium --retries=0 --output=test-results/ui
      env:
        PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/ui
        PLAYWRIGHT_HTML_OPEN: never
        # Vite preview validates config metadata; it serves the downloaded build unchanged.
        VITE_SITE_URL: "https://localiserbien.fr"
        VITE_SITE_NAME: "LocaliserBien"
        VITE_APP_TITLE: "LocaliserBien - Recherchez des correspondances DPE"
        VITE_APP_DESCRIPTION: "Recherchez gratuitement des correspondances possibles dans les données DPE publiques en France. Un résultat ne garantit pas l'identification du bien."
        VITE_APP_KEYWORDS: "localisation bien immobilier,DPE,adresse bien,recherche immobilier,diagnostic performance énergétique,France,localiser bien"
        VITE_OG_TITLE: "LocaliserBien - Recherchez des correspondances DPE"
        VITE_OG_DESCRIPTION: "Recherchez gratuitement des correspondances possibles dans les données DPE publiques en France. Un résultat ne garantit pas l'identification du bien."
        VITE_TWITTER_TITLE: "LocaliserBien - Recherchez des correspondances DPE"
        VITE_TWITTER_DESCRIPTION: "Recherchez gratuitement des correspondances possibles dans les données DPE publiques en France. Un résultat ne garantit pas l'identification du bien."
    - name: Retain product browser evidence even on failure
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: product-browser-evidence
        path: |
          test-results/ui/
          test-results/e2e-results.json
          test-results/e2e-junit.xml
          playwright-report/ui/
        retention-days: 14
    - name: Retain PWA browser evidence even on failure
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pwa-lifecycle-evidence
        path: |
          reports/pwa/
          test-results/pwa/
          playwright-report/pwa/
        retention-days: 14

  security-check:
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'preflight'
    name: Dependency Policy
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
    
    - name: Install exact locked dependencies for tree verification
      run: npm ci --ignore-scripts --no-audit

    - name: Test dependency policy failure cases
      run: npm run test:security

    - name: Require clean full and production audits and retired-package absence
      run: npm run security:audit

    - name: Retain raw audits, installed tree and policy evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dependency-audit-evidence
        path: reports/security/
        retention-days: 14
    
    - name: 🔍 Check for sensitive data
      run: |
        echo "Checking for potential secrets..."
        # Check for potential API keys or passwords
        ! grep -r "AIzaSy" --include="*.js" --include="*.vue" --include="*.ts" --exclude-dir=node_modules --exclude-dir=dist src/ || echo "Warning: Potential API key found"
        ! grep -r "password.*=.*['\"]" --include="*.js" --include="*.vue" --include="*.ts" --exclude-dir=node_modules --exclude-dir=dist src/ || echo "Warning: Potential hardcoded password found"
        echo "Security check completed"

  preflight:
    name: Read-only OVH preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'preflight'
    environment: ovh-production
    concurrency:
      group: localiserbien-production
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Verify TLS, destination and live fingerprints without writes
      run: python3 scripts/deployment/ovh_release.py preflight
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

  deploy:
    name: Publish reviewed release over verified FTPS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint-and-test, security-check]
    # This general release job remains manual-only. The bounded one-release
    # job below also preserves the existing protected production environment.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy'
    environment: ovh-production
    concurrency:
      group: localiserbien-production
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '24.x'
    - uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: dist/
    - name: Revalidate the exact downloaded public build
      run: node scripts/check-built-site.mjs
    - name: Read the pinned public recovery-source commit
      id: public-baseline
      run: |
        python3 - <<'PYCODE'
        import json, os, re
        from pathlib import Path
        plan = json.loads(Path("scripts/deployment/public-release-plan.json").read_text())
        commit = plan['source_commit']
        assert re.fullmatch(r'[a-f0-9]{40}', commit)
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('commit=' + commit + '\n')
        PYCODE
    - name: Check out immutable public recovery sources
      uses: actions/checkout@v4
      with:
        ref: ${{ steps.public-baseline.outputs.commit }}
        path: .release-baseline
        persist-credentials: false
    - name: Verify public recovery sources, stage public files, and promote without cleanup
      run: |
        python3 scripts/deployment/ovh_release.py deploy \
          --reviewed-commit "$REVIEWED_COMMIT" \
          --baseline-root .release-baseline \
          --expected-index "$EXPECTED_INDEX" \
          --htaccess "$HTACCESS_POLICY" \
          --release-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
      env:
        REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        EXPECTED_INDEX: ${{ inputs.expected_index_sha256 }}
        HTACCESS_POLICY: ${{ inputs.htaccess }}
        OVH_RELEASE_ENABLED: ${{ vars.OVH_RELEASE_ENABLED }}
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

  deploy-reviewed-edf392c:
    name: Publish requested edf392c release over verified FTPS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint-and-test, security-check, pwa-lifecycle]
    # One authorized release only: an immediate workflow-only child of this
    # reviewed main commit. Later pushes and pull requests cannot activate it.
    if: github.repository == 'Aurfi/DPE-LocaliserBien' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.before == 'edf392cff080df120361a22bee59b0ee2d5f226e'
    environment: ovh-production
    concurrency:
      group: localiserbien-production
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Verify bounded release scope
      run: |
        python3 - <<'PYCODE'
        import json, os, subprocess
        from pathlib import Path
        reviewed = 'edf392cff080df120361a22bee59b0ee2d5f226e'
        parents = subprocess.check_output(['git', 'rev-list', '--parents', '-n', '1', 'HEAD'], text=True).split()
        assert parents == [os.environ['GITHUB_SHA'], reviewed], 'Release must directly follow reviewed main.'
        changed = subprocess.check_output(['git', 'diff', '--name-only', reviewed, 'HEAD'], text=True).splitlines()
        assert changed == ['.github/workflows/ci.yml'], 'Only this release workflow may differ from reviewed main.'
        plan = json.loads(Path('scripts/deployment/public-release-plan.json').read_text())
        assert plan['source_commit'] == '68c927b466726839fd7f30990d35355f35ea75fd'
        assert plan['candidate_sha256'] == 'db458630402cf9d46ed8197f055bba46aa7cdff06f8e7c650bd7ed1d506bc3bb'
        assert len(plan['files']) == 139
        PYCODE
    - uses: actions/setup-node@v4
      with:
        node-version: '24.x'
    - name: Download the exact candidate exercised by this run's browser tests
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: dist/
    - name: Require identical reviewed public build bytes
      run: |
        node scripts/check-built-site.mjs
        python3 - <<'PYCODE'
        import sys
        sys.path.insert(0, 'scripts/deployment')
        from ovh_release import build_digest, inventory
        files = inventory('dist')
        assert len(files) == 139
        assert build_digest(files) == 'db458630402cf9d46ed8197f055bba46aa7cdff06f8e7c650bd7ed1d506bc3bb', 'Build differs from the reviewed artifact.'
        PYCODE
    - name: Check out immutable public recovery sources
      uses: actions/checkout@v4
      with:
        ref: 68c927b466726839fd7f30990d35355f35ea75fd
        path: .release-baseline
        persist-credentials: false
    - name: Read fresh live fingerprint without changing production
      id: fresh-preflight
      run: |
        python3 scripts/deployment/ovh_release.py preflight > "$RUNNER_TEMP/ovh-preflight.json"
        cat "$RUNNER_TEMP/ovh-preflight.json"
        python3 - <<'PYCODE'
        import json, os
        from pathlib import Path
        result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'ovh-preflight.json').read_text())
        plan = json.loads(Path('scripts/deployment/public-release-plan.json').read_text())
        expected = next(entry['before'] for entry in plan['files'] if entry['path'] == 'index.html')
        assert result['index_sha256'] == expected, 'Live index differs from the reviewed recovery baseline.'
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('index_sha256=' + expected + '\n')
        PYCODE
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    - name: Promote reviewed public files while preserving existing configuration
      run: |
        python3 scripts/deployment/ovh_release.py deploy \
          --reviewed-commit "$GITHUB_SHA" \
          --baseline-root .release-baseline \
          --expected-index "$EXPECTED_INDEX" \
          --htaccess preserve \
          --release-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
      env:
        EXPECTED_INDEX: ${{ steps.fresh-preflight.outputs.index_sha256 }}
        # Explicit authorization for this one bounded release; no persistent
        # environment variable, permission, or ordinary deploy gate is changed.
        OVH_RELEASE_ENABLED: reviewed-and-approved
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

  diagnose-ovh-ftps-once:
    name: Diagnose existing OVH FTPS connection without writes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Read-only diagnosis of the exact failed attempt. No release or credential
    # changes; later pushes and pull requests cannot activate this job.
    if: github.repository == 'Aurfi/DPE-LocaliserBien' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.before == 'ec05cb110f440ce8ca63000ee2c5e4959964139e'
    environment: ovh-production
    concurrency:
      group: localiserbien-production
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Verify the diagnostic-only revision
      run: |
        python3 - <<'PYCODE'
        import os, subprocess
        parent = 'ec05cb110f440ce8ca63000ee2c5e4959964139e'
        parents = subprocess.check_output(['git', 'rev-list', '--parents', '-n', '1', 'HEAD'], text=True).split()
        assert parents == [os.environ['GITHUB_SHA'], parent], 'Diagnostic must directly follow the failed attempt.'
        changed = subprocess.check_output(['git', 'diff', '--name-only', parent, 'HEAD'], text=True).splitlines()
        assert changed == ['.github/workflows/ci.yml'], 'Only this diagnostic workflow may change.'
        PYCODE
    - name: Report safe FTPS failure stage without writes or secret output
      run: |
        python3 - <<'PYCODE'
        import ftplib, json, re, ssl, sys
        sys.path.insert(0, 'scripts/deployment')
        import ovh_release as release
        phase = 'local-validation'
        original = ftplib.FTP_TLS
        class ObservedFTP(original):
            pass
        def observe(method, label):
            operation = getattr(original, method)
            def traced(self, *args, **kwargs):
                global phase
                phase = label
                return operation(self, *args, **kwargs)
            return traced
        for method, label in {
            'connect': 'control-connect', 'auth': 'control-tls',
            'login': 'authenticate', 'prot_p': 'protect-data',
            'pwd': 'resolve-root', 'cwd': 'select-root',
            'mlsd': 'list-target', 'retrbinary': 'read-live-file',
        }.items():
            setattr(ObservedFTP, method, observe(method, label))
        ftplib.FTP_TLS = ObservedFTP
        ftp = None
        try:
            ftp = release.connect()
            remote = release.Remote(ftp)
            release.preflight(remote)
        except release.ReleaseError as error:
            print('Stopped: ' + str(error), file=sys.stderr)
            sys.exit(1)
        except (ftplib.Error, OSError, ValueError, KeyError, TypeError) as error:
            # Only allowlisted phase/type and numeric error codes. Never log raw
            # exceptions, hostnames, usernames, passwords, or live file contents.
            detail = {'stage': phase, 'category': 'secure-transfer-failed'}
            if isinstance(error, ssl.SSLCertVerificationError):
                detail['category'] = 'tls-certificate-verification'
                detail['verify_code'] = error.verify_code
            elif isinstance(error, ssl.SSLError):
                detail['category'] = 'tls-protocol'
            elif isinstance(error, ftplib.Error):
                detail['category'] = 'ftp-protocol'
                code = str(error)[:3]
                if re.fullmatch(r'[1-5][0-9]{2}', code):
                    detail['reply_code'] = code
            elif isinstance(error, OSError):
                detail['category'] = 'network-or-filesystem'
                detail['errno'] = error.errno
            print('Stopped: ' + json.dumps(detail, sort_keys=True), file=sys.stderr)
            sys.exit(1)
        finally:
            if ftp is not None:
                ftp.close()
        PYCODE
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

  probe-ovh-secure-transports-once:
    name: Check same-host secure transports without authentication
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One bounded read-only probe; no account, credential or hosting change.
    if: github.repository == 'Aurfi/DPE-LocaliserBien' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.before == '1d489ab0abcf3d5300b649dc5ac1c729bce8ee36'
    environment: ovh-production
    concurrency:
      group: localiserbien-production
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Verify the probe-only revision
      run: |
        python3 - <<'PYCODE'
        import os, subprocess
        parent = '1d489ab0abcf3d5300b649dc5ac1c729bce8ee36'
        parents = subprocess.check_output(['git', 'rev-list', '--parents', '-n', '1', 'HEAD'], text=True).split()
        assert parents == [os.environ['GITHUB_SHA'], parent], 'Probe must directly follow the read-only diagnosis.'
        changed = subprocess.check_output(['git', 'diff', '--name-only', parent, 'HEAD'], text=True).splitlines()
        assert changed == ['.github/workflows/ci.yml'], 'Only the workflow may change.'
        PYCODE
    - name: Probe configured hostname without username or password
      run: |
        python3 - <<'PYCODE'
        """No-login, no-write protocol probe against the existing configured hostname."""
        import base64
        import ftplib
        import hashlib
        import json
        import os
        import re
        import socket
        import ssl
        import subprocess
        import urllib.parse
        import urllib.request
        
        
        def failure(error):
            if isinstance(error, ssl.SSLCertVerificationError):
                return {'status': 'certificate-rejected', 'verify_code': error.verify_code}
            if isinstance(error, ssl.SSLError):
                return {'status': 'tls-protocol-failed'}
            if isinstance(error, ftplib.Error):
                result = {'status': 'ftp-protocol-failed'}
                code = str(error)[:3]
                if re.fullmatch(r'[1-5][0-9]{2}', code): result['reply_code'] = int(code)
                return result
            if isinstance(error, OSError):
                return {'status': 'network-or-tool-failed', 'errno': error.errno}
            return {'status': 'probe-failed'}
        
        
        def tls_context():
            context = ssl.create_default_context()
            context.minimum_version = ssl.TLSVersion.TLSv1_2
            return context
        
        
        def explicit_ssl(host):
            ftp = ftplib.FTP(timeout=8)
            try:
                ftp.connect(host, 21)
                ftp.voidcmd('AUTH SSL')
                with tls_context().wrap_socket(ftp.sock, server_hostname=host):
                    return {'status': 'verified-tls-control', 'authenticated': False}
            except Exception as error:
                return failure(error)
            finally:
                ftp.close()
        
        
        def implicit_tls(host):
            try:
                with socket.create_connection((host, 990), timeout=8) as raw:
                    with tls_context().wrap_socket(raw, server_hostname=host) as secure:
                        greeting = secure.recv(512)
                        return {'status': 'verified-tls-control' if greeting.startswith(b'220') else 'unexpected-greeting',
                                'authenticated': False}
            except Exception as error:
                return failure(error)
        
        
        def trusted_dns_fingerprints(host):
            query = urllib.parse.urlencode({'name': host, 'type': 'SSHFP', 'do': 'true',
                                           'cd': 'false', 'edns_client_subnet': '0.0.0.0/0'})
            try:
                with urllib.request.urlopen('https://dns.google/resolve?' + query,
                                            context=tls_context(), timeout=10) as response:
                    data = json.loads(response.read(1024 * 1024))
                question = data.get('Question', [])
                question_matches = (len(question) == 1 and question[0].get('type') == 44 and
                                    question[0].get('name', '').rstrip('.').lower() == host.lower())
                secure = (question_matches and data.get('Status') == 0 and data.get('AD') is True
                          and data.get('CD') is False and data.get('TC') is False)
                records = []
                for answer in data.get('Answer', []):
                    if answer.get('type') != 44 or answer.get('name', '').rstrip('.').lower() != host.lower():
                        continue
                    parts = answer.get('data', '').split()
                    if (len(parts) == 3 and parts[0] in ('1', '3', '4') and parts[1] == '2'
                            and re.fullmatch(r'[0-9a-fA-F]{64}', parts[2])):
                        records.append((int(parts[0]), parts[2].lower()))
                return {'status': 'dnssec-verified' if secure else 'not-dnssec-verified',
                        'sha256_record_count': len(records)}, set(records) if secure else set()
            except Exception as error:
                return failure(error), set()
        
        
        def ssh_probe(host, trusted):
            try:
                # Only the public host-key exchange; no username, password, or login.
                result = subprocess.run(['ssh-keyscan', '-T', '8', '-p', '22', '-t', 'ed25519,ecdsa,rsa', host],
                                        capture_output=True, text=True, timeout=30, check=False)
                observed, matched = set(), set()
                algorithms = {'ssh-rsa': 1, 'ecdsa-sha2-nistp256': 3,
                              'ecdsa-sha2-nistp384': 3, 'ecdsa-sha2-nistp521': 3, 'ssh-ed25519': 4}
                for line in result.stdout.splitlines():
                    fields = line.split()
                    if len(fields) != 3 or fields[1] not in algorithms: continue
                    if fields[0].lower() not in (host.lower(), '[' + host.lower() + ']:22'): continue
                    key = base64.b64decode(fields[2], validate=True)
                    item = (algorithms[fields[1]], hashlib.sha256(key).hexdigest())
                    observed.add(item)
                    if item in trusted: matched.add(item)
                return {'status': 'host-key-observed' if observed else 'no-host-key-observed',
                        'observed_key_count': len(observed), 'dnssec_matching_key_count': len(matched),
                        'host_verified': bool(matched), 'authenticated': False}
            except Exception as error:
                return failure(error)
        
        
        def main():
            host = os.environ.get('FTP_SERVER', '')
            if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.-]*', host):
                print(json.dumps({'status': 'configured-host-missing-or-invalid'}))
                return 1
            # Raw banners, DNS responses, hostnames, SSH keys and exceptions are not logged.
            report = {'authentication_attempted': False, 'writes_attempted': False}
            report['auth_ssl_port_21'] = explicit_ssl(host)
            report['implicit_tls_port_990'] = implicit_tls(host)
            report['dns_sshfp'], trusted = trusted_dns_fingerprints(host)
            report['ssh_port_22'] = ssh_probe(host, trusted)
            print(json.dumps(report, sort_keys=True))
            return 0
        
        if __name__ == '__main__':
            raise SystemExit(main())
        PYCODE
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}

  capture-ovh-public-fingerprint-once:
    name: Capture public SSH fingerprints without login
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'Aurfi/DPE-LocaliserBien' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.before == 'e92e6fb1908c6ce8b09f10716469e7d27d85fad7'
    environment: ovh-production
    concurrency:
      group: localiserbien-production
      cancel-in-progress: false
    steps:
    - name: Read only public host keys from the already configured server
      run: |
        python3 - <<'PYCODE'
        import base64, hashlib, json, os, re, subprocess, sys
        host = os.environ.get('FTP_SERVER', '')
        if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.-]*', host):
            sys.exit('Stopped: configured hostname is unavailable or invalid.')
        try:
            result = subprocess.run(['ssh-keyscan', '-T', '8', '-p', '22', '-t', 'ed25519,ecdsa,rsa', host],
                                    capture_output=True, text=True, timeout=30, check=False)
            keys = set()
            for line in result.stdout.splitlines():
                fields = line.split()
                if len(fields) != 3 or fields[0].lower() not in (host.lower(), '[' + host.lower() + ']:22'):
                    continue
                if fields[1] not in ('ssh-ed25519', 'ecdsa-sha2-nistp256', 'ecdsa-sha2-nistp384', 'ecdsa-sha2-nistp521', 'ssh-rsa'):
                    continue
                raw = base64.b64decode(fields[2], validate=True)
                fingerprint = 'SHA256:' + base64.b64encode(hashlib.sha256(raw).digest()).decode().rstrip('=')
                keys.add((fields[1], fingerprint))
            if not keys:
                sys.exit('Stopped: no public SSH host key observed.')
            print(json.dumps({'authentication_attempted': False, 'writes_attempted': False,
                              'independently_verified': False,
                              'public_host_keys': [{'type': kind, 'fingerprint': fingerprint} for kind, fingerprint in sorted(keys)]}, sort_keys=True))
        except (OSError, ValueError, subprocess.SubprocessError):
            sys.exit('Stopped: public host-key capture failed; raw details are omitted.')
        PYCODE
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}

  deploy-reviewed-release-sftp-once:
    name: Publish requested release over pinned SFTP
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint-and-test, security-check, pwa-lifecycle]
    # One release only, activated only after explicit owner approval of the
    # observed first-use Ed25519 fingerprint. Later pushes cannot activate it.
    if: github.repository == 'Aurfi/DPE-LocaliserBien' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.before == '42ba735b75483b18d5a094e2748fc3fe296172a9'
    environment: ovh-production
    concurrency:
      group: localiserbien-production
      cancel-in-progress: false
    env:
      OVH_SFTP_HOST_KEY_TYPE: ssh-ed25519
      OVH_SFTP_HOST_KEY_SHA256: SHA256:6053kGsbCzj0rOIpNAz9SNbToAfBc/rUoX/LlnG1AhY
    steps:
    - uses: actions/checkout@v4
      with:
        # Include the reviewed application commit through the diagnostic chain.
        fetch-depth: 6
        persist-credentials: false
    - name: Verify exact release parent and application scope
      run: |
        python3 - <<'PYCODE'
        import json, os, subprocess
        from pathlib import Path
        reviewed = 'edf392cff080df120361a22bee59b0ee2d5f226e'
        parent = '42ba735b75483b18d5a094e2748fc3fe296172a9'
        parents = subprocess.check_output(['git', 'rev-list', '--parents', '-n', '1', 'HEAD'], text=True).split()
        assert parents == [os.environ['GITHUB_SHA'], parent], 'Release must directly follow the fingerprint capture.'
        changed = subprocess.check_output(['git', 'diff', '--name-only', reviewed, 'HEAD'], text=True).splitlines()
        assert changed == ['.github/workflows/ci.yml', 'scripts/deployment/ovh_sftp_release.py', 'tests/deployment_sftp/test_ovh_sftp_release.py'], 'Application, build, recovery plan, and existing release engine must remain unchanged.'
        plan = json.loads(Path('scripts/deployment/public-release-plan.json').read_text())
        assert plan['source_commit'] == '68c927b466726839fd7f30990d35355f35ea75fd'
        assert plan['candidate_sha256'] == 'db458630402cf9d46ed8197f055bba46aa7cdff06f8e7c650bd7ed1d506bc3bb'
        assert len(plan['files']) == 139
        PYCODE
    - name: Install pinned SFTP tool in this protected job only
      run: python3 -m pip install --disable-pip-version-check 'paramiko==5.0.0'
    - name: Verify exact-pin authentication and guarded SFTP release behavior offline
      run: python3 -m unittest discover -s tests/deployment_sftp -p 'test_*.py' -v
    - uses: actions/setup-node@v4
      with:
        node-version: '24.x'
    - name: Download the exact candidate exercised by this run's browser tests
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: dist/
    - name: Require identical reviewed public build bytes
      run: |
        node scripts/check-built-site.mjs
        python3 - <<'PYCODE'
        import sys
        sys.path.insert(0, 'scripts/deployment')
        from ovh_release import build_digest, inventory
        files = inventory('dist')
        assert len(files) == 139
        assert build_digest(files) == 'db458630402cf9d46ed8197f055bba46aa7cdff06f8e7c650bd7ed1d506bc3bb', 'Build differs from the reviewed artifact.'
        PYCODE
    - name: Check out immutable public recovery sources
      uses: actions/checkout@v4
      with:
        ref: 68c927b466726839fd7f30990d35355f35ea75fd
        path: .release-baseline
        persist-credentials: false
    - name: Read fresh SFTP fingerprint without changing production
      id: fresh-sftp-preflight
      run: |
        python3 scripts/deployment/ovh_sftp_release.py preflight > "$RUNNER_TEMP/ovh-sftp-preflight.json"
        cat "$RUNNER_TEMP/ovh-sftp-preflight.json"
        python3 - <<'PYCODE'
        import json, os
        from pathlib import Path
        result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'ovh-sftp-preflight.json').read_text())
        plan = json.loads(Path('scripts/deployment/public-release-plan.json').read_text())
        expected = next(entry['before'] for entry in plan['files'] if entry['path'] == 'index.html')
        assert result['index_sha256'] == expected, 'Live index differs from the reviewed recovery baseline.'
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('index_sha256=' + expected + '\n')
        PYCODE
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    - name: Promote reviewed public files while preserving existing configuration
      run: |
        python3 scripts/deployment/ovh_sftp_release.py deploy \
          --reviewed-commit "$GITHUB_SHA" \
          --baseline-root .release-baseline \
          --expected-index "$EXPECTED_INDEX" \
          --htaccess preserve \
          --release-id "github-sftp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
      env:
        EXPECTED_INDEX: ${{ steps.fresh-sftp-preflight.outputs.index_sha256 }}
        # Applies only to this explicitly authorized, exact-artifact release.
        OVH_RELEASE_ENABLED: reviewed-and-approved
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

