name: CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Read-only preflight, or publish an explicitly reviewed release'
        type: choice
        required: true
        default: preflight
        options: [preflight, deploy]
      reviewed_commit:
        description: 'Deploy only: exact reviewed 40-character main commit'
        type: string
        default: ''
      expected_index_sha256:
        description: 'Deploy only: live index SHA-256 from a fresh preflight'
        type: string
        default: ''
      htaccess:
        description: 'preserve (default), or explicitly verified confirmed-absent'
        type: string
        default: preserve
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  lint-and-test:
    # A manual read-only preflight does not need a dependency install or build.
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'preflight'
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [24.x]
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false
      
    - name: 🔧 Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: 📦 Install dependencies
      run: npm ci
    
    - name: 🔍 Run Biome linter
      run: npm run lint
      continue-on-error: false
    
    - name: Verify finite CSS classes and native HTML interpolation
      run: |
        npm run check:styles
        npm run test:styles
        npm run test:html

    - name: Test deployment safety offline
      run: python3 -m unittest discover -s scripts/deployment -p 'test_*.py' -v

    - name: 🧪 Run tests and enforce coverage thresholds
      run: npm run test:coverage
      continue-on-error: false
      env:
        TZ: Europe/Paris
    
    - name: 🏗️ Build project
      run: |
        cat > .env << 'ENVEOF'
        VITE_SITE_URL=https://localiserbien.fr
        VITE_SITE_NAME=LocaliserBien
        VITE_SITE_DOMAIN=localiserbien.fr
        VITE_CONTACT_EMAIL=contact@localiserbien.fr
        VITE_PUBLICATION_DIRECTOR=
        VITE_ADEME_API_URL=https://data.ademe.fr/data-fair/api/v1/datasets/dpe03existant/lines
        VITE_GEO_API_URL=https://data.geopf.fr/geocodage
        VITE_APP_TITLE=Trouver l’adresse d’une annonce avec son DPE | LocaliserBien
        VITE_APP_DESCRIPTION=Recherchez des correspondances possibles dans les données DPE publiques en France. Un résultat ne garantit pas l'identification du bien.
        VITE_APP_KEYWORDS=localisation bien immobilier,DPE,adresse bien,recherche immobilier,diagnostic performance énergétique,France,localiser bien
        VITE_OG_TITLE=LocaliserBien - Recherchez des correspondances DPE
        VITE_OG_DESCRIPTION=Recherchez des correspondances possibles dans les données DPE publiques en France. Un résultat ne garantit pas l'identification du bien.
        VITE_TWITTER_TITLE=LocaliserBien - Recherchez des correspondances DPE
        VITE_TWITTER_DESCRIPTION=Recherchez des correspondances possibles dans les données DPE publiques en France. Un résultat ne garantit pas l'identification du bien.
        VITE_HOST_NAME=OVH
        VITE_HOST_ADDRESS=2 rue Kellermann, 59100 Roubaix, France
        VITE_ENABLE_ANALYTICS=false
        VITE_FANCY_UI=true
        VITE_DEV_PORT=3000
        ENVEOF
        npm run build
        node scripts/check-built-site.mjs
      env:
        CI: true
    
    - name: Retain browser dependency boundary evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: browser-dependency-graph
        path: reports/security/runtime-module-graph.json
        if-no-files-found: ignore
        retention-days: 14

    - name: 📊 Check build output
      run: |
        echo "Build completed successfully!"
        echo "Checking dist folder..."
        ls -la dist/
        echo "Build size:"
        du -sh dist/
    
    - name: 📝 Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: dist/
        retention-days: 7
        # Required for the reviewed route-only .htaccess. The build check rejects
        # unexpected hidden files before this artifact can be uploaded.
        include-hidden-files: true

  pwa-lifecycle:
    name: PWA lifecycle (two pinned baselines to same-run candidate)
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy')
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: npm
    - name: Install current locked test toolchain only
      run: npm ci
    - name: Verify immutable baseline and offline fixture failure cases
      run: npm run test:pwa:unit
    - name: Install official Playwright Chromium and OS dependencies
      run: npx --no-install playwright install --with-deps chromium
    - name: Download this run's exact candidate build
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: dist/
    - name: Verify preserved baseline bytes and record exact artifact provenance
      run: node scripts/pwa/provenance.mjs record
    - name: Test real installation, open-tab upgrade, cleanup and offline boundaries
      run: npm run test:pwa
    - name: Test page copy, mobile filters and inline-map lifecycle
      run: npx --no-install playwright test e2e/map-preview.spec.js e2e/product-pages.spec.js --project=chromium --retries=0 --output=test-results/ui
      env:
        PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/ui
        PLAYWRIGHT_HTML_OPEN: never
        # Vite preview validates config metadata; it serves the downloaded build unchanged.
        VITE_SITE_URL: "https://localiserbien.fr"
        VITE_SITE_NAME: "LocaliserBien"
        VITE_APP_TITLE: "Trouver l’adresse d’une annonce avec son DPE | LocaliserBien"
        VITE_APP_DESCRIPTION: "Recherchez des correspondances possibles dans les données DPE publiques en France. Un résultat ne garantit pas l'identification du bien."
        VITE_APP_KEYWORDS: "localisation bien immobilier,DPE,adresse bien,recherche immobilier,diagnostic performance énergétique,France,localiser bien"
        VITE_OG_TITLE: "LocaliserBien - Recherchez des correspondances DPE"
        VITE_OG_DESCRIPTION: "Recherchez des correspondances possibles dans les données DPE publiques en France. Un résultat ne garantit pas l'identification du bien."
        VITE_TWITTER_TITLE: "LocaliserBien - Recherchez des correspondances DPE"
        VITE_TWITTER_DESCRIPTION: "Recherchez des correspondances possibles dans les données DPE publiques en France. Un résultat ne garantit pas l'identification du bien."
    - name: Retain product browser evidence even on failure
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: product-browser-evidence
        path: |
          test-results/ui/
          test-results/e2e-results.json
          test-results/e2e-junit.xml
          playwright-report/ui/
        retention-days: 14
    - name: Retain PWA browser evidence even on failure
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pwa-lifecycle-evidence
        path: |
          reports/pwa/
          test-results/pwa/
          playwright-report/pwa/
        retention-days: 14

  security-check:
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'preflight'
    name: Dependency Policy
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
    
    - name: Install exact locked dependencies for tree verification
      run: npm ci --ignore-scripts --no-audit

    - name: Test dependency policy failure cases
      run: npm run test:security

    - name: Require clean full and production audits and retired-package absence
      run: npm run security:audit

    - name: Retain raw audits, installed tree and policy evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dependency-audit-evidence
        path: reports/security/
        retention-days: 14
    
    - name: 🔍 Check for sensitive data
      run: |
        echo "Checking for potential secrets..."
        # Check for potential API keys or passwords
        ! grep -r "AIzaSy" --include="*.js" --include="*.vue" --include="*.ts" --exclude-dir=node_modules --exclude-dir=dist src/ || echo "Warning: Potential API key found"
        ! grep -r "password.*=.*['\"]" --include="*.js" --include="*.vue" --include="*.ts" --exclude-dir=node_modules --exclude-dir=dist src/ || echo "Warning: Potential hardcoded password found"
        echo "Security check completed"


  deployment-safety:
    name: SFTP release safety (offline)
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Install the existing pinned SFTP test dependency
      run: python3 -m pip install --disable-pip-version-check 'paramiko==5.0.0'
    - name: Verify release engine, trigger, host pin, drift and recovery failure cases
      run: |
        python3 -m unittest discover -s scripts/deployment -p 'test_*.py' -v
        python3 -m unittest discover -s tests/deployment_sftp -p 'test_*.py' -v
        python3 -m unittest discover -s tests/deployment_routes -p 'test_*.py' -v
        python3 -m unittest discover -s tests/deployment_workflow -p 'test_*.py' -v

  release-intent:
    name: Check explicit release intent without hosting access
    if: github.repository == 'Aurfi/DPE-LocaliserBien' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.intent.outputs.enabled }}
      source_commit: ${{ steps.intent.outputs.source_commit }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Activate only a new reviewed release-only commit
      id: intent
      run: python3 scripts/deployment/release_intent.py

  preflight:
    name: Read-only OVH preflight over pinned SFTP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'Aurfi/DPE-LocaliserBien' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'preflight'
    environment: ovh-production
    concurrency:
      group: localiserbien-production
      cancel-in-progress: false
    env:
      OVH_SFTP_HOST_KEY_TYPE: ssh-ed25519
      OVH_SFTP_HOST_KEY_SHA256: SHA256:6053kGsbCzj0rOIpNAz9SNbToAfBc/rUoX/LlnG1AhY
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Install the existing pinned SFTP tool
      run: python3 -m pip install --disable-pip-version-check 'paramiko==5.0.0'
    - name: Verify trusted host, destination and live fingerprints without writes
      run: python3 scripts/deployment/ovh_sftp_release.py preflight
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

  deploy:
    name: Publish explicitly reviewed release over pinned SFTP
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint-and-test, security-check, pwa-lifecycle, deployment-safety, release-intent]
    # Ordinary pushes never publish. A release-only commit must change the
    # intent, name its exact reviewed parent, and pass every same-run test.
    if: github.repository == 'Aurfi/DPE-LocaliserBien' && github.ref == 'refs/heads/main' && needs.release-intent.outputs.enabled == 'true'
    environment: ovh-production
    concurrency:
      group: localiserbien-production
      cancel-in-progress: false
    env:
      OVH_SFTP_HOST_KEY_TYPE: ssh-ed25519
      OVH_SFTP_HOST_KEY_SHA256: SHA256:6053kGsbCzj0rOIpNAz9SNbToAfBc/rUoX/LlnG1AhY
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Revalidate the active intent inside the protected production job
      run: python3 scripts/deployment/release_intent.py --require-active
    - name: Install the existing pinned SFTP tool
      run: python3 -m pip install --disable-pip-version-check 'paramiko==5.0.0'
    - uses: actions/setup-node@v4
      with:
        node-version: '24.x'
    - name: Download the exact candidate exercised by this run's browser tests
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: dist/
    - name: Revalidate public build boundaries
      run: node scripts/check-built-site.mjs
    - name: Check out immutable reviewed public recovery sources
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.release-intent.outputs.source_commit }}
        path: .release-baseline
        persist-credentials: false
    - name: Observe current main before any production write
      uses: actions/checkout@v4
      with:
        ref: main
        path: .latest-main
        persist-credentials: false
    - name: Verify exact artifact and all live hashes, then stage and promote
      run: python3 scripts/deployment/reviewed_sftp_release.py
      env:
        # Enabled only after explicit release intent and all protected job gates.
        # Does not create or change a repository/environment variable.
        OVH_RELEASE_ENABLED: reviewed-and-approved
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
