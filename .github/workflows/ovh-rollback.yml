name: Recover a reviewed OVH release

on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: 'Exact reviewed main commit containing this recovery tool'
        type: string
        required: true
      release_id:
        description: 'Recovery release ID printed by the original deploy run'
        type: string
        required: true
      release_plan_commit:
        description: 'Exact original deployed commit containing its reviewed public recovery plan'
        type: string
        required: true
      expected_index_sha256:
        description: 'Current live index SHA-256 from a fresh read-only preflight'
        type: string
        required: true

permissions:
  contents: read

jobs:
  rollback:
    name: Restore verified public before-images without deleting retained assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main'
    environment: ovh-production
    concurrency:
      group: localiserbien-production
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    # Recovery deliberately does not depend on a fresh frontend build or network
    # dependency installation. Test this checked-out tool before giving it secrets.
    - name: Test recovery logic offline
      run: python3 -m unittest discover -s scripts/deployment -p 'test_*.py' -v
    - name: Validate the original release commit before checkout
      run: python3 -c 'import os,re; assert re.fullmatch(r"[a-f0-9]{40}", os.environ["RECOVERY_PLAN_COMMIT"])'
      env:
        RECOVERY_PLAN_COMMIT: ${{ inputs.release_plan_commit }}
    - name: Load the original reviewed plan even after main advances
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.release_plan_commit }}
        path: .recovery-plan
        persist-credentials: false
    - name: Read the pinned public recovery-source commit
      id: public-baseline
      run: |
        python3 - <<'PYCODE'
        import json, os, re
        from pathlib import Path
        plan = json.loads(Path(".recovery-plan/scripts/deployment/public-release-plan.json").read_text())
        commit = plan['source_commit']
        assert re.fullmatch(r'[a-f0-9]{40}', commit)
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('commit=' + commit + '\n')
        PYCODE
    - name: Check out immutable public recovery sources
      uses: actions/checkout@v4
      with:
        ref: ${{ steps.public-baseline.outputs.commit }}
        path: .release-baseline
        persist-credentials: false
    - name: Verify the original public plan and live files, then recover via FTPS
      run: |
        python3 scripts/deployment/ovh_release.py rollback \
          --reviewed-commit "$REVIEWED_COMMIT" \
          --plan .recovery-plan/scripts/deployment/public-release-plan.json \
          --plan-commit "$RECOVERY_PLAN_COMMIT" \
          --baseline-root .release-baseline \
          --expected-index "$EXPECTED_INDEX" \
          --release-id "$RECOVERY_RELEASE_ID"
      env:
        REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        EXPECTED_INDEX: ${{ inputs.expected_index_sha256 }}
        RECOVERY_RELEASE_ID: ${{ inputs.release_id }}
        RECOVERY_PLAN_COMMIT: ${{ inputs.release_plan_commit }}
        OVH_RELEASE_ENABLED: ${{ vars.OVH_RELEASE_ENABLED }}
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
